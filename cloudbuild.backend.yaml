substitutions:
  _REGION: us-central1
  _SERVICE: itera-care-backend
  _REPOSITORY: itera
  _ALLOWED_ORIGIN: https://itera-payroll.vercel.app
  _AUDIT_DATABASE: itera-audit

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.backend", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=itera-care-backend@${PROJECT_ID}.iam.gserviceaccount.com
      - --ingress=all
      - --allow-unauthenticated
      - --set-env-vars=NODE_ENV=production,APP_ENV=production,DATA_STORE=google-sheets-monthly,IMPORTS_ENABLED=false,FIREBASE_PROJECT_ID=${PROJECT_ID},ALLOWED_ORIGINS=${_ALLOWED_ORIGIN},AUDIT_FIRESTORE_DATABASE_ID=${_AUDIT_DATABASE}
      - --set-secrets=GOOGLE_SHARED_DRIVE_ID=itera-shared-drive-id:latest,GOOGLE_ROOT_FOLDER_ID=itera-root-folder-id:latest,GOOGLE_MONTHLY_FOLDER_ID=itera-monthly-folder-id:latest,GOOGLE_MASTER_FOLDER_ID=itera-master-folder-id:latest,GOOGLE_MASTER_SPREADSHEET_ID=itera-master-spreadsheet-id:latest,IMPORT_ANALYSIS_TOKEN_SECRET=itera-import-analysis-token-secret:latest
      - --min-instances=1
      - --max-instances=10
      - --concurrency=40
      - --cpu=1
      - --memory=1Gi
      - --timeout=60s

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - beta
      - run
      - services
      - update
      - ${_SERVICE}
      - --region=${_REGION}
      - --default-url
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
